<div>
  <h2>Which Tournament to Register?</h2>

  <!-- Loading or error states -->
  @if (loading) {
    <div>Loading leagues, please wait...</div>
  }
  @if (errorMessage) {
    <div>{{ errorMessage }}</div>
  }

  <hr />

  <!-- Show the list of leagues -->
  @if (!loading && availableLeagues.length > 0) {
    <div>
      <h3>Available Leagues</h3>
      <ul>
        @for (league of availableLeagues; track league) {
          <li>
            <a
              href="javascript:void(0)"
              class="league-link"
              (click)="onLeagueSelect(league.leagueId)">
              {{ league.leagueName }}
            </a>
          </li>
        }
      </ul>
    </div>
  }
</div>
