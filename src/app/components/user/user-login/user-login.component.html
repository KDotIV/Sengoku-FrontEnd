<section class="registration" aria-labelledby="login-title">
  <h1 id="login-title">Welcome back</h1>
  @if (users.account()) {
    <p>You are signed in as {{ users.account()?.userName }}.</p>
    <a routerLink="/">Explore Sengoku</a>
  } @else {
    <form #form="ngForm" class="panel" (ngSubmit)="login(form)">
      <fieldset [disabled]="busy || !users.ready()">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" [(ngModel)]="email" autocomplete="email" required email />
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required />
        <button type="submit">{{ busy ? 'Signing in…' : 'Sign in' }}</button>
      </fieldset>
      @if (error) { <p role="alert" class="error">{{ error }}</p> }
      <p>New here? <a routerLink="/user-register">Create your account</a></p>
    </form>
  }
</section>
